<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Portfolio</title>
  <meta name="description" content="Personal portfolio">
  <script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="preconnect" href="https://ijegsiigtcamwkdzgsck.supabase.co" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="nav">
    <div class="nav-in">
      <a href="#profil" class="brand" id="brand">Portfolio</a>
      <nav>
        <a href="#proyek">Projects</a>
        <a href="#organisasi">Organizations</a>
        <a href="#sertifikasi">Certifications</a>
        <a href="#tools">Tools</a>
        <a href="#skill">Skills</a>
      </nav>
    </div>
  </header>

  <main>
    <section id="profil" class="hero">
      <div class="hero-copy">
        <div class="idrow">
          <div class="photo" id="photo"></div>
          <div class="prompt"><b>$</b>whoami</div>
        </div>
        <h1 id="name">Loading…</h1>
        <p class="headline" id="headline"></p>
        <p class="bio" id="bio"></p>
        <div class="actions" id="actions"></div>
      </div>
      <div class="code" id="devcard" aria-label="Developer profile"></div>
    </section>

    <section id="proyek" class="block">
      <div class="head"><h2><span class="sl">//</span>Projects</h2></div>
      <div class="body"><div class="pgrid" id="projects"></div></div>
    </section>

    <section id="organisasi" class="block">
      <h2><span class="sl">//</span>Organizations</h2>
      <div class="body"><div class="olist" id="orgs"></div></div>
    </section>

    <section id="sertifikasi" class="block">
      <h2><span class="sl">//</span>Certifications</h2>
      <div class="body" id="certs"></div>
    </section>

    <section id="tools" class="block">
      <h2><span class="sl">//</span>Tools</h2>
      <div class="body"><div class="chips" id="tools-list"></div></div>
    </section>

    <section id="skill" class="block">
      <h2><span class="sl">//</span>Skills</h2>
      <div class="body">
        <div class="cols">
          <div><h3>Hard skills</h3><div class="chips" id="hard"></div></div>
          <div><h3>Soft skills</h3><div class="chips" id="soft"></div></div>
        </div>
      </div>
    </section>
  </main>

  <footer id="footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
